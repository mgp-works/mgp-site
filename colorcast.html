<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinGyo Park - mgp.works</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/images/favicon.png" type="image/png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script type="module" src="js/components/site-header.js"></script>
    <script type="module" src="js/components/site-footer.js"></script>
    <script type="module" src="js/components/project-card.js"></script>
  </head>

  <body class="colorcast-page">
    <div class="cc-ambient" aria-hidden="true">
      <span class="cc-ambient__blob cc-ambient__blob--1"></span>
      <span class="cc-ambient__blob cc-ambient__blob--2"></span>
      <span class="cc-ambient__blob cc-ambient__blob--3"></span>
    </div>

    <site-header variant="colorcast"></site-header>

    <main>
      <section class="cc-hero page">
        <div id="idle">
          <!-- <img
            src="assets/logo/cc-logo-light.svg"
            class="cc-star"
            width="28px"
          /> -->
          <h1 class="cc-header headline-lg">Colorcast</h1>
          <h2 class="cc-title headline-sm">
            The universe has spoken (in hex codes).
          </h2>
          <p class="cc-paragraph body-md">
            Get today’s fortune and a matching custom palette. Like a horoscope,
            but you can use it in Figma.
          </p>

          <button id="generate-button" class="cc-btn">
            <img src="assets/emphasize-icon.svg" class="cc-btn-icon-left" />
            <span class="body-md">Reveal my Colorcast</span>
            <img src="assets/emphasize-icon.svg" class="cc-btn-icon-right" />
          </button>

          <!-- <p class="cc-caption caption">
            For fun. Use your judgment. Unless it's weirdly accurate.
          </p> -->
        </div>

        <div id="loading" style="display: none">
          <img
            src="assets/logo/cc-logo-light.svg"
            class="cc-star-spinner"
            width="28px"
          />
          <p class="cc-title headline-sm">Loading...</p>
        </div>

        <div id="result" style="display: none">
          <div class="cc-result-hero">
            <!-- <img
              src="assets/logo/cc-logo-light.svg"
              class="cc-star"
              width="28px"
            /> -->
            <p class="cc-title headline-sm">Today looks like this.</p>
          </div>

          <div id="result-card" class="cc-result-card">
            <div class="cc-result-text">
              <p id="resultDate" class="cc-result-date caption"></p>
              <p class="cc-result-label body-md">Today's Colorcast</p>
              <img
                src="assets/logo/cc-logo-light.svg"
                class="cc-star"
                width="12px"
              />
              <p id="fortuneEN" class="cc-result-fortune body-lg"></p>
            </div>
            <div id="colors" class="cc-colors"></div>
          </div>

          <div class="cc-result-actions">
            <button id="save-png-button" class="cc-btn">
              <img src="assets/download-icon.svg" class="cc-btn-icon-left" />
              <span class="body-md">Save as PNG</span>
            </button>

            <p id="try-again-followup" class="cc-followup caption">
              ...or
              <a href="#" id="try-again-link" class="cc-link">try again</a>
              one last time
            </p>

            <button id="go-home-button" class="cc-btn" style="display: none">
              <span class="body-md">Go home</span>
            </button>
          </div>
        </div>

        <div id="limit-reached" style="display: none">
          <p class="cc-title headline-sm">That's all the universe has today.</p>
          <p class="cc-paragraph body-md">Come back tomorrow.</p>

          <button id="go-back-button" class="cc-btn">
            <span class="body-md">Go back</span>
          </button>
        </div>
      </section>
    </main>

    <site-footer></site-footer>
    <script src="js/colorcast.js?v=20260717"></script>
  </body>
</html>
